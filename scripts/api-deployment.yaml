apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
        - name: api
          image: localhost:5000/nodeapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
          env:
            - name: MONGO_HOST
              value: "mongo"  # Kubernetes service name
